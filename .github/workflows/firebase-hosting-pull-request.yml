# Deploys every pull request to a temporary Firebase Hosting preview channel (pr-<number>).
# Auth: keyless via Workload Identity Federation (security brief W-2). See the merge workflow
# for the one-time GCP setup.
name: Deploy to Firebase Hosting on PR

on: pull_request

permissions:
  contents: read
  id-token: write   # required for Workload Identity Federation

jobs:
  preview:
    # Forks cannot obtain a WIF token for this repo; only same-repo branches get a preview.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Authenticate to Google Cloud (keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/129852317945/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: github-deployer@freshout-education.iam.gserviceaccount.com

      - name: Install firebase-tools (pinned — same version the Freshout360 keyless deploy uses)
        run: npm install -g firebase-tools@13.35.1

      - name: Deploy to preview channel
        run: firebase hosting:channel:deploy pr-${{ github.event.number }} --expires 7d --project freshout-education
