# Deploys public/ to Firebase Hosting on every push to main.
# Requires the repository secret FIREBASE_SERVICE_ACCOUNT_FRESHOUT_EDUCATION
# (created by `firebase init hosting:github`, or a Hosting Admin service-account key).
name: Deploy to Firebase Hosting
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FRESHOUT_EDUCATION }}
          channelId: live
          projectId: freshout-education
