# Deploys the site to Firebase Hosting when main changes.
# Auth: keyless via Workload Identity Federation (security brief W-2) — no service-account
# key stored in GitHub. Mirrors Freshout360/.github/workflows/deploy-hosting.yml.
#
# JULYANNA — one-time setup before this workflow can run:
#   1. Create the WIF pool + provider in GCP project freshout-education (attribute
#      condition limited to repository == FreshOutEducation/freshout-education-website).
#   2. Create SA github-deployer@freshout-education.iam.gserviceaccount.com with
#      roles/firebasehosting.admin only, and grant the provider roles/iam.workloadIdentityUser on it.
#   3. (done 2026-09-22) provider and service account filled in below.
#   4. After ONE successful deploy from this workflow, delete the
#      FIREBASE_SERVICE_ACCOUNT_FRESHOUT_EDUCATION repo secret and the SA key in GCP.
name: Deploy to Firebase Hosting on merge

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write   # required for Workload Identity Federation

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Authenticate to Google Cloud (keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/129852317945/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: github-deployer@freshout-education.iam.gserviceaccount.com

      - name: Deploy hosting to live
        run: npx firebase-tools@15.29.0 deploy --only hosting --project freshout-education
